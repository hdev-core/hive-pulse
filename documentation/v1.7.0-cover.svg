<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="6" fill="#f97316"/>

  <!-- Brand: bolt + wordmark -->
  <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" fill="#f97316" transform="translate(66,62) scale(1.5)"/>
  <text x="106" y="100" font-size="34" font-weight="700" fill="#f97316">HivePulse</text>
  <rect x="290" y="76" width="92" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="336" y="97" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">v1.7.0</text>

  <!-- Headline -->
  <text x="70" y="208" font-size="34" font-weight="500" fill="#94a3b8">Write smarter.</text>
  <text x="68" y="288" font-size="70" font-weight="800" fill="#f97316">SEO + GEO</text>
  <text x="70" y="362" font-size="66" font-weight="800" fill="#f8fafc">Post Analyzer</text>

  <!-- Sub -->
  <text x="72" y="424" font-size="23" fill="#cbd5e1">Real-time discoverability for every Hive post —</text>
  <text x="72" y="456" font-size="23" fill="#cbd5e1">built for search engines <tspan fill="#34d399" font-weight="700">and</tspan> AI alike.</text>

  <!-- Supported frontends -->
  <text x="72" y="556" font-size="17" fill="#64748b">PeakD &#183; Ecency &#183; Hive.blog &#183; InLeo &#183; LeoFinance &#183; 3Speak &#183; Actifit</text>

  <!-- Panel mock card -->
  <rect x="700" y="120" width="440" height="400" rx="16" fill="#1e293b" stroke="#334155"/>
  <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" fill="#f97316" transform="translate(722,150) scale(0.85)"/>
  <text x="746" y="167" font-size="19" font-weight="700" fill="#f97316">Post Analyzer</text>

  <!-- Tabs -->
  <text x="772" y="208" font-size="15" font-weight="700" fill="#f97316" text-anchor="middle">SEO</text>
  <rect x="742" y="218" width="60" height="3" rx="1.5" fill="#f97316"/>
  <text x="1000" y="208" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">AI &#183; GEO</text>

  <!-- SEO ring -->
  <circle cx="810" cy="318" r="58" fill="none" stroke="#0f172a" stroke-width="13"/>
  <circle cx="810" cy="318" r="58" fill="none" stroke="#34d399" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="335.3 364.4" transform="rotate(-90 810 318)"/>
  <text x="810" y="330" font-size="42" font-weight="800" fill="#f8fafc" text-anchor="middle">92</text>
  <text x="810" y="406" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">SEO SCORE</text>

  <!-- GEO ring -->
  <circle cx="1030" cy="318" r="58" fill="none" stroke="#0f172a" stroke-width="13"/>
  <circle cx="1030" cy="318" r="58" fill="none" stroke="#34d399" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="320.7 364.4" transform="rotate(-90 1030 318)"/>
  <text x="1030" y="330" font-size="42" font-weight="800" fill="#f8fafc" text-anchor="middle">88</text>
  <text x="1030" y="406" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">AI / GEO</text>

  <!-- Mini bars -->
  <text x="724" y="452" font-size="13" fill="#cbd5e1">Keyword</text>
  <rect x="724" y="458" width="392" height="6" rx="3" fill="#0f172a"/>
  <rect x="724" y="458" width="330" height="6" rx="3" fill="#34d399"/>
  <text x="724" y="486" font-size="13" fill="#cbd5e1">Structure</text>
  <rect x="724" y="492" width="392" height="6" rx="3" fill="#0f172a"/>
  <rect x="724" y="492" width="300" height="6" rx="3" fill="#34d399"/>
</svg>
